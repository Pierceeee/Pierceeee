name: Generate Snake Animation

on:
  schedule:
    # Rebuild once a day so the snake stays in sync with new contributions
    - cron: "0 0 * * *"
  # Lets you run it manually from the Actions tab (needed for the first run)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Two variants so the snake reads correctly in both GitHub themes.
          # Palette matches the README's tokyonight system.
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#3B5BA5
            dist/snake-dark.svg?palette=github-dark&color_snake=#70A5FD

      - name: Publish to the snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
